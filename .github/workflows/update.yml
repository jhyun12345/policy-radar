name: 정책 레이더 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * 2,3,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 데이터 갱신
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-data.js
      - name: 변경 사항 저장
        run: |
          git config user.name "policy-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          [ -f data.prev.json ] && git add data.prev.json || true
          git diff --cached --quiet || git commit -m "정책 레이더 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
